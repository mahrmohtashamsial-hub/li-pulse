[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "li-pulse"
version = "0.1.0"
description = "Classify LinkedIn profiles by recent activity using third-party data providers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "rich>=13.7",
  "typer>=0.12",
  "streamlit>=1.36",
  "pandas>=2.2",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
li-pulse = "li_pulse.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/li_pulse"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

